[package]
name = "signerd"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "tee-signer host daemon: loads the enclave, persists the sealed blob, serves the HTTP API, feeds headers, logs receipts — transport and storage only, authorises nothing"
publish = false

[features]
default = []
# The real enclave through libenclave_u.a + libsgx_urts (build on the SGX box with ENCLAVE_U_DIR set).
sgx = []
# In-process rcore in host simulation (no SGX): for laptop end-to-end tests of the daemon logic.
nosgx = ["dep:rcore"]
# REQ-r9: the `tss` TPM transport (a local TPM 2.0 through libtss2: `SIGNERD_TPM=tss:…`, `tpm-setup`,
# `tpm-teardown`). Needs libtss2-dev at build time and libtss2-esys/-tctildr/-mu/-sys at run time.
tss = ["dep:tss-esapi"]

[dependencies]
signer-core = { path = "../../core", features = ["std"] }
rcore = { path = "../../enclave/rcore", features = ["nosgx", "test-init"], optional = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bitcoin = { version = "0.32", features = ["std", "base64"] }
rand = "0.8"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "arithmetic", "std"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
# the bearer token compared in constant time (#23)
subtle = "2"
# bundled x86_64-linux bindings (no clang in the build image); links the system libtss2 via pkg-config
tss-esapi = { version = "7.7", optional = true }

# Hard rule 9 (CLAUDE.md): SafeMath — no bare arithmetic operator; every operation names its failure mode.
[lints.clippy]
arithmetic_side_effects = "deny"
# a truncating or sign-losing `as` is the same class (#18): `u32::try_from`, or a reason on the line
cast_possible_truncation = "deny"
cast_sign_loss = "deny"

# the runtime net of rule 9: a slip panics instead of wrapping, in release too
[profile.release]
overflow-checks = true
