<rect width="1200" height="740" fill="#0A1022"/>
<text x="40" y="52" font-size="28" fill="#F1F5F9" font-weight="800" letter-spacing="-0.5">The parts, and where trust ends</text>
<text x="40" y="80" font-size="16" fill="#94A3B8">The host carries bytes and decides nothing; the enclave checks every byte against its sealed state and the owner's key.</text>
