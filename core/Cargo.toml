[package]
name = "signer-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "tee-signer trusted core: PSBT classification, mandate (policy) engine, canonical encodings, receipts — no_std, pure, host-testable"
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = []
# Host-side only: std for tests, tools and the owner/daemon crates. Never set for the enclave build.
std = ["bitcoin/std", "secp256k1/std", "sha2/std", "p256/std"]
# Test-only guard knobs for the hollow-test (mutation) suite. The release build script refuses it
# and the build asserts its absence (CONDITIONS C-R12b discipline). Not available without `std`.
hollow-test = ["std"]

[dependencies]
# Exact pins — every line here is in the enclave TCB (CONDITIONS C-R10b; core/PROVENANCE.md).
bitcoin   = { version = "=0.32.102", default-features = false }
secp256k1 = { version = "=0.29.1", default-features = false, features = ["alloc", "lowmemory"] }
sha2      = { version = "=0.10.9",  default-features = false, features = ["force-soft"] }
p256      = { version = "=0.13.2",  default-features = false, features = ["ecdsa", "arithmetic"] }
hmac      = { version = "=0.12.1",  default-features = false }
pbkdf2    = { version = "=0.12.2",  default-features = false, features = ["hmac"] }

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hard rule 9 (CLAUDE.md), R11 (C-EXT1-1): SafeMath in the TCB — the three lints reach tests/ too (the
# `#![deny]` in src/lib.rs does not); a bare operator or a truncating `as` fails `cargo clippy`.
[lints.clippy]
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"

# overflow-checks (R11): the runtime net for the host tests of this crate; inside the enclave the profile of
# enclave/rcore/Cargo.toml (the enclave build's root manifest) governs.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 2
overflow-checks = true

[profile.dev]
panic = "abort"
overflow-checks = true
