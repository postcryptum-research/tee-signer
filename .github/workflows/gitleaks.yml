name: gitleaks

# Secret scan over the FULL history on every push and pull request. Must stay green: a red run blocks
# the merge. The image is pinned by digest (the same build used for the pre-publication history scan
# on 2026-11-20); false positives are allowlisted in .gitleaks.toml with the reason next to each.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks detect (all history)
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact --verbose
