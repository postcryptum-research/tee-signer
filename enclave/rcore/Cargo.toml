[package]
name = "rcore"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "tee-signer enclave FFI crate: the only place with unsafe — SDK calls, sealing, randomness, BIP39, recovery blob, the ecall dispatcher"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
# Host-side simulation of the SDK calls (no sealing, deterministic randomness). For tests of the
# dispatcher logic on a machine without SGX. Never set for an enclave build; the Makefile refuses.
nosgx = []
# The vector replay entry point (TEST_INIT with a known seed). Never in a release enclave; the
# release build refuses the feature and asserts the symbol is absent (C-R9 bar).
test-init = []
# REQ-r7 §2.6, the operator's opt-out AT BUILD TIME ONLY: the pause after a restart is compiled OUT
# and the enclave arms itself at load. Its MRENCLAVE differs from the pinned one, STATUS/the card say
# `auto_arm`, and the Makefile refuses it together with CEREMONY=1 (the ceremony key never signs it).
# Never a runtime switch: a config/env/signerd flag would be root's to flip (C-R7-8).
auto-arm = []

[dependencies]
signer-core = { path = "../../core", default-features = false }
bitcoin   = { version = "=0.32.102", default-features = false }
secp256k1 = { version = "=0.29.1", default-features = false, features = ["alloc", "lowmemory"] }
sha2      = { version = "=0.10.9",  default-features = false, features = ["force-soft"] }
hkdf      = { version = "=0.12.4",  default-features = false }
p256      = { version = "=0.13.2",  default-features = false, features = ["ecdsa", "arithmetic", "ecdh"] }
aes-gcm   = { version = "=0.10.3",  default-features = false, features = ["aes", "alloc"] }
zeroize   = { version = "1", default-features = false }

# Hard rule 9 (CLAUDE.md), R11 (C-EXT1-1): SafeMath in the TCB — no bare arithmetic operator, no truncating or
# sign-losing `as`; every operation names its failure mode. The table reaches tests and bins (a crate attribute
# does not); the same three lints are also at the top of src/lib.rs.
[lints.clippy]
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"

# This manifest is the ROOT of the enclave build (`cargo build --locked --release` here, gate 3), so these
# profiles govern signer-core compiled into the enclave as well. overflow-checks (R11, C-EXT1-1): an arithmetic
# overflow the conversion missed panics → with panic = "abort" the ecall aborts (fail-closed; the host sees
# SGX_ERROR_ENCLAVE_CRASHED and nothing is charged) instead of wrapping into a wrong number.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 2
overflow-checks = true

[profile.dev]
panic = "abort"
overflow-checks = true

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signer-core = { path = "../../core", features = ["std"] }
p256 = { version = "=0.13.2", features = ["ecdsa", "ecdh", "arithmetic", "std"] }
