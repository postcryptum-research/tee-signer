# gitleaks configuration — the default rules; nothing is allowlisted by pattern.
# Pre-publication scan of the full history, 2026-11-20 (gitleaks v8.21.2 + trufflehog 3.82.13): no secret
# ever committed. The three default-rule hits (public values and a grep pattern) are excluded by their exact
# commit:file:rule:line fingerprints in .gitleaksignore, never by a regex — a future real secret of the same
# shape in the same file stays a finding (auditor's note, 2026-11-20). The two path entries below are files
# that ARE public key material by nature; any other path with a hit is a finding.

[extend]
useDefault = true

[allowlist]
description = "public key material by nature (verified 2026-11-20)"
paths = [
  # public CA certificates compiled into owner-cli (Intel SGX root, Yubico attestation root + intermediate)
  '''^owner/owner-cli/src/(intel_sgx_root_ca|yubico-ca-1|yubico-intermediate)\.pem$''',
  # the public BIP39 English wordlist
  '''^core/src/bip39-english\.txt$''',
]
