# gitleaks configuration — the default rules plus an allowlist of verified false positives.
# Pre-publication scan of the full history, 2026-11-20 (gitleaks v8.21.2 + trufflehog 3.82.13):
# no secret ever committed; the three default-rule hits below are public values or a grep pattern.
# Add an entry only with the line's reason; never allowlist a path wholesale to make CI green.

[extend]
useDefault = true

[allowlist]
description = "verified false positives (2026-11-20 history scan)"
regexTarget = "line"
regexes = [
  # docs/audit/REQ-r5-t2-azure-impl-2026-11-03.md — the MRSIGNER (a public SIGSTRUCT hash) of the dev signing key
  '''MRSIGNER of the dev key''',
  # docs/studies/NOSTD-ENCLAVE-LAB-2026-11-03.md — a compressed secp256k1 PUBLIC key in a lab log
  '''pubkey\s*=\s*0[23][0-9a-fA-F]{64}''',
  # scripts/owner-secrets-check.sh — a grep pattern that checks the PEM header type, not a key
  '''BEGIN ENCRYPTED PRIVATE KEY-----"''',
]
paths = [
  # public CA certificates compiled into owner-cli (Intel SGX root, Yubico attestation root + intermediate)
  '''owner/owner-cli/src/(intel_sgx_root_ca|yubico-ca-1|yubico-intermediate)\.pem''',
  # the public BIP39 English wordlist
  '''core/src/bip39-english\.txt''',
]
