# The style the code was written in, pinned (2026-11-11) so that `cargo fmt --check` is a gate again: with
# rustfmt defaults the same files showed hundreds of diffs; with these settings only a one-time mechanical
# pass was needed (its commit equals `cargo fmt` run on its parent — reproducible, no semantic change).
edition = "2021"
max_width = 120
use_small_heuristics = "Max"
